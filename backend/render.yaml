services:
  - type: web
    name: todo-backend
    env: python
    buildCommand: "pip install --upgrade pip && pip install --only-binary=all -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: PIP_ONLY_BINARY
        value: ":all:"